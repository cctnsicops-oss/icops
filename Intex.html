<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
    @page {
        size: A4;
        margin: 15mm;
    }
    @font-face {
        font-family: 'AnjaliOldLipi';
        src: url('https://cdn.jsdelivr.net/gh/google/fonts/ofl/anjalioldlipi/AnjaliOldLipi-Regular.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
    }
    body {
        font-family: 'AnjaliOldLipi', 'Noto Sans Malayalam', 'Arial', sans-serif;
        font-size: 13pt;
        line-height: 1.8;
        color: #000;
        margin: 0;
        padding: 0;
        background: #fff;
    }
    .memo-page {
        display: none;
        box-sizing: border-box;
        width: 100%;
        background: #fff;
        padding: 10px;
    }
    .memo-page.active {
        display: block;
    }
    .letterhead-table {
        width: 100%;
        border-bottom: 2px solid #000;
        padding-bottom: 10px;
        margin-bottom: 15px;
        border-collapse: collapse;
    }
    .letterhead-left {
        width: 18%;
        text-align: left;
        vertical-align: middle;
    }
    .letterhead-center {
        width: 64%;
        text-align: center;
        vertical-align: middle;
    }
    .letterhead-right {
        width: 18%;
        text-align: right;
        vertical-align: middle;
    }
    .letterhead-center h3 {
        margin: 0 0 3px 0;
        font-size: 12pt;
        font-weight: bold;
        color: #000;
        font-family: 'Arial', sans-serif;
    }
    .letterhead-center p {
        margin: 2px 0;
        font-size: 10pt;
        font-weight: bold;
        font-family: 'Arial', sans-serif;
    }
    .memo-info-table {
        width: 100%;
        margin-bottom: 15px;
        font-weight: bold;
        font-size: 12pt;
    }
    .notice-title {
        text-align: center;
        font-weight: bold;
        font-size: 14pt;
        margin: 10px 0 15px 0;
        letter-spacing: 0.5px;
        text-decoration: underline;
        font-family: 'Arial', sans-serif;
    }
    .station-heading {
        font-weight: bold;
        margin-bottom: 12px;
        font-size: 13pt;
    }
    .body-content {
        text-align: justify;
        text-justify: inter-word;
        margin-bottom: 25px;
        word-break: normal;
        overflow-wrap: break-word;
    }
    .signature-block {
        float: right;
        text-align: right;
        margin-top: 20px;
        font-weight: bold;
        line-height: 1.4;
    }
    .upload-box {
        background: #f0f0f0;
        padding: 20px;
        margin-bottom: 20px;
        border: 2px dashed #ccc;
        text-align: center;
    }
    .input-controls {
        background: #e2e8f0;
        padding: 15px;
        margin-bottom: 20px;
        border-radius: 6px;
        text-align: center;
    }
    .input-controls input, .input-controls select {
        padding: 8px;
        margin: 5px 10px;
        font-size: 11pt;
        border: 1px solid #cbd5e0;
        border-radius: 4px;
    }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

    <div class="upload-box">
        <h3>Upload Citizen Service Pending Details Excel</h3>
        <input type="file" id="excelFile" accept=".xlsx, .xls">
    </div>

    <div class="input-controls" id="controlsSection" style="display:none;">
        <label><strong>Office Number:</strong> <input type="text" id="globalOfficeNo" value="No. _____/TD/DCRB/26/EC" oninput="updateHeaderDetails()"></label>
        <label><strong>Data Upload / Memo Date:</strong> <input type="text" id="globalDate" value="" oninput="updateHeaderDetails()"></label><br><br>
        <label><strong>Select Police Station:</strong> 
            <select id="stationSelect" onchange="switchStation()"></select>
        </label>
        <p style="margin: 10px 0 0 0; font-size: 10pt; color: #4a5568;"><em>(The date you set above will automatically apply to both the header date and the date inside the text body. Highlight and copy/paste directly from below)</em></p>
    </div>

    <div id="memosContainer" style="width: 170mm; margin: 0 auto; border: 1px solid #cbd5e0; padding: 20px; background: #fff; border-radius: 6px;"></div>

<script>
let globalJsonData = [];

// Automatically set the current date in DD.MM.YYYY format upon loading
function getFormattedDate(dateObj) {
    let day = String(dateObj.getDate()).padStart(2, '0');
    let month = String(dateObj.getMonth() + 1).padStart(2, '0');
    let year = dateObj.getFullYear();
    return `${day}.${month}.${year}`;
}

document.getElementById('globalDate').value = getFormattedDate(new Date());

document.getElementById('excelFile').addEventListener('change', function(e) {
    let file = e.target.files[0];
    if (!file) return;

    // Automatically capture file upload date or keep user-adjusted date
    document.getElementById('globalDate').value = getFormattedDate(new Date());

    let reader = new FileReader();
    reader.onload = function(e) {
        let data = new Uint8Array(e.target.result);
        let workbook = XLSX.read(data, {type: 'array'});
        let sheet = workbook.Sheets[workbook.SheetNames[0]];
        globalJsonData = XLSX.utils.sheet_to_json(sheet, {header: 1});
        initializeStationSelector();
        updateHeaderDetails();
        alert("Excel loaded successfully! Upload date has been automatically applied. Please select your station from the dropdown below.");
    };
    reader.readAsArrayBuffer(file);
});

function initializeStationSelector() {
    if (globalJsonData.length === 0) return;

    let select = document.getElementById('stationSelect');
    select.innerHTML = '';
    let container = document.getElementById('memosContainer');
    container.innerHTML = '';

    let officeNo = document.getElementById('globalOfficeNo').value;
    let memoDate = document.getElementById('globalDate').value;
    let validIndex = 0;

    for (let i = 1; i < globalJsonData.length; i++) {
        let row = globalJsonData[i];
        let station = row[0];
        if (!station || station.includes('SDPO') || station.includes('TOTAL SUM')) continue;

        let stationName = station.trim();
        
        let option = document.createElement('option');
        option.value = `memo_${i}`;
        option.textContent = stationName;
        select.appendChild(option);

        let accident_gd = row[1] || 0;
        let mike = row[2] || 0;
        let nioc = row[3] || 0;
        let lost_property = row[4] || 0;
        let complaints = row[5] || 0;

        let twoDaysParts = [];
        if (accident_gd > 0) twoDaysParts.push(`${accident_gd} Accident GD അപേക്ഷ`);
        if (mike > 0) twoDaysParts.push(`${mike} Mike അപേക്ഷ`);
        if (nioc > 0) twoDaysParts.push(`${nioc} NIOC അപേക്ഷ`);
        let twoDaysStr = twoDaysParts.join(", ");

        let fourteenDaysParts = [];
        if (lost_property > 0) fourteenDaysParts.push(`${lost_property} Lost Property അപേക്ഷ`);
        if (complaints > 0) fourteenDaysParts.push(`${complaints} പരാതികളും`);
        let fourteenDaysStr = fourteenDaysParts.join(", ");

        let middleSentence = "";
        if (twoDaysStr && fourteenDaysStr) {
            middleSentence = `താങ്കളുടെ സ്റ്റേഷനിൽ 2 ദിവസത്തിനകം തീർപ്പാകാത്ത ${twoDaysStr} എന്നിവയും 14 ദിവസത്തിനകം തീർപ്പാകാത്ത ${fourteenDaysStr} പെന്റിങ് കാണിക്കുന്നുണ്ട്.`;
        } else if (twoDaysStr) {
            middleSentence = `താങ്കളുടെ സ്റ്റേഷനിൽ 2 ദിവസത്തിനകം തീർപ്പാകാത്ത ${twoDaysStr} എന്നിവയും പെന്റിങ് കാണിക്കുന്നുണ്ട്.`;
        } else if (fourteenDaysStr) {
            middleSentence = `താങ്കളുടെ സ്റ്റേഷനിൽ 14 ദിവസത്തിനകം തീർപ്പാകാത്ത ${fourteenDaysStr} പെന്റിങ് കാണിക്കുന്നുണ്ട്.`;
        } else {
            middleSentence = `താങ്കളുടെ സ്റ്റേഷനിൽ പെന്റിങ് ഒന്നുമില്ല.`;
        }

        let exactText = `താങ്കളുടെ സ്റ്റേഷനിൽ THUNA പോർട്ടൽ വഴിയും, നേരിട്ട് സ്റ്റേഷനിൽ രജിസ്റ്റർ ചെയ്യുന്നതുമായ Accident GD അപേക്ഷകൾ, Mike അപേക്ഷകൾ, NIOC അപേക്ഷകൾ എന്നിവ ലഭിച്ചു 2 ദിവസത്തിനകം തീർപ്പാക്കണമെന്നും, Lost Property അപേക്ഷകൾ, പരാതികൾ എന്നിവ ലഭിച്ചു 14 ദിവസത്തിനകം തീർപ്പാക്കണമെന്നും No.1510/TD/DCRB/26/EC dated 16.07.2026, No.1524/TD/DCRB/26/EC dated 18.07.2026 എന്നീ ഓർഡർ പ്രകാരം ഈ ഓഫീസിൽ നിന്നും അറിയിച്ചിട്ടുള്ളതാണ്. കൂടാതെ ഇത് സംബന്ധിച്ചു ബഹു. DCP L&O 2 അവർകൾ നിരന്തരം കർശന നിർദേശം നൽകിയിട്ടുള്ളതുമാണ്. എന്നാൽ <span class="dyn-date-text">${memoDate}</span> തീയതിയിൽ THUNA/Citizen Portal pendency പരിശോധിച്ചതിൽ ${middleSentence} അച്ചടക്കമുള്ള പോലീസ് സേനയിലെ ഒരംഗമെന്ന നിലയിൽ താങ്കളെ ഏല്പിച്ച ജോലി യഥാസമയം കൃത്യമായി നിർവഹിക്കാതെ,  മേലുദ്യോഗസ്ഥന്റെ  നിർദേശങ്ങളെ അവഗണിച്ചുകൊണ്ടുള്ള താങ്കളുടെ ഇത്തരത്തിലുള്ള പ്രവൃത്തി ഗുരുതരമായ കൃത്യവിലോപവും അച്ചടക്കലംഘനവുമാകയാൽ ഇക്കാര്യത്തിൽ താങ്കൾക്ക്  എന്തെങ്കിലും സമാധാനം ബോധിപ്പിക്കാനുണ്ടെങ്കിൽ ഈ മെമ്മോ കൈപ്പറ്റി 48 മണിക്കൂറിനകം രേഖാമൂലം സമർപ്പിക്കേണ്ടതാണ്. അല്ലാത്തപക്ഷം ഇക്കാര്യത്തിൽ താങ്കൾക്ക് യാതൊന്നും ബോധിപ്പിക്കുവാനില്ലാ എന്ന നിഗമനത്തിൽ താങ്കൾക്ക്ക്കെതിരെ അച്ചടക്ക നടപടികൾ സ്വീകരിക്കുന്നതാണ്. ഈ മെമ്മോയുടെ പകർപ്പ് ഒപ്പിട്ടശേഷം DCRB-യിലേക്ക് നൽകേണ്ടതാണ്.`;

        let pageDiv = document.createElement('div');
        pageDiv.className = `memo-page ${validIndex === 0 ? 'active' : ''}`;
        pageDiv.id = `memo_${i}`;
        pageDiv.innerHTML = `
            <table class="letterhead-table">
                <tr>
                    <td class="letterhead-left">
                        <svg width="60" height="75" viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
                            <path d="M20 15 L80 15 L80 65 Q80 95 50 108 Q20 95 20 65 Z" fill="#1a237e" stroke="#000" stroke-width="2"/>
                            <path d="M50 15 L80 15 L80 65 Q80 95 50 108 Z" fill="#ffa000"/>
                            <text x="50" y="70" font-size="42" fill="#b71c1c" font-family="serif" font-weight="bold" text-anchor="middle">E</text>
                        </svg>
                    </td>
                    <td class="letterhead-center">
                        <h3>Office of the Asst Commissioner of Police</h3>
                        <p>District Crimes Records Bureau</p>
                        <p>Police Commissionerate, Kochi</p>
                        <p>Ph: 0484-2366900 | Email: acpdcrbekm.pol@kerala.gov.in</p>
                    </td>
                    <td class="letterhead-right">
                        <svg width="60" height="75" viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="50" cy="50" r="42" fill="#b71c1c" stroke="#fbc02d" stroke-width="4"/>
                            <circle cx="50" cy="50" r="34" fill="#d32f2f"/>
                            <text x="50" y="32" font-size="7.5" fill="#fff" font-weight="bold" text-anchor="middle">KERALA</text>
                            <text x="50" y="75" font-size="7.5" fill="#fff" font-weight="bold" text-anchor="middle">POLICE</text>
                            <ellipse cx="50" cy="52" rx="12" ry="15" fill="#ffeb3b"/>
                            <path d="M42 68 Q50 82 58 68 Z" fill="#388e3c"/>
                        </svg>
                    </td>
                </tr>
            </table>

            <table class="memo-info-table">
                <tr>
                    <td style="width: 50%; text-align: left;" class="dyn-office">${officeNo}</td>
                    <td style="width: 50%; text-align: right;">Date: <span class="dyn-date">${memoDate}</span></td>
                </tr>
            </table>

            <table class="memo-info-table" style="margin-bottom: 5px; font-size: 11pt;">
                <tr>
                    <td style="text-align: left;">Ref: Upload / Data Extraction Date: <span class="dyn-date">${memoDate}</span></td>
                </tr>
            </table>

            <div class="notice-title">SHOW CAUSE NOTICE</div>
            <div class="station-heading">കൊച്ചി സിറ്റി ${stationName} പൊലീസ് സ്റ്റേഷൻ, സ്റ്റേഷൻ ഹൗസ് ഓഫീസർക്ക് നൽകുന്ന ഷോക്കോസ് നോട്ടീസ്.</div>
            <div class="body-content">${exactText}</div>
            <div class="signature-block">
                Asst Commissioner of Police<br>
                DCRB, Kochi City
            </div>
            <div style="clear: both;"></div>
        `;
        container.appendChild(pageDiv);
        validIndex++;
    }

    document.getElementById('controlsSection').style.display = 'block';
}

function updateHeaderDetails() {
    let officeNo = document.getElementById('globalOfficeNo').value;
    let memoDate = document.getElementById('globalDate').value;

    document.querySelectorAll('.dyn-office').forEach(el => {
        el.textContent = officeNo;
    });
    document.querySelectorAll('.dyn-date').forEach(el => {
        el.textContent = memoDate;
    });
    document.querySelectorAll('.dyn-date-text').forEach(el => {
        el.textContent = memoDate;
    });
}

function switchStation() {
    let selectedId = document.getElementById('stationSelect').value;
    let pages = document.querySelectorAll('.memo-page');
    pages.forEach(p => p.classList.remove('active'));
    document.getElementById(selectedId).classList.add('active');
}
</script>

</body>
</html>
